# Kitty 账本 · 远程部署 nginx 配置（HTTP 版 · 非标端口 · 双栈监听）
#
# 用法：
#   1. 复制本文件到  /etc/nginx/conf.d/kitty-cclian.conf
#   2. 替换 2 处占位：server_name、root
#      （端口默认 5201，要换就改 listen 两行）
#   3. nginx -t && systemctl reload nginx
#   4. 访问 http://cclian-kitty.art:5201
#
# 注意：listen 不带地址 = 双栈监听（IPv4 + IPv6 都收），
#       这是 purple-workbench(5200) 能通、而 node 只监听 IPv4 不通的根本原因。

server {
    listen 5201;
    listen [::]:5201;
    server_name cclian-kitty.art;

    root /var/www/kitty-cclian;
    index index.html;

    # 静态资源 / SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 入口文件与 Service Worker 不缓存，保证发版即时生效
    location = /index.html    { add_header Cache-Control "no-cache"; }
    location = /sw.js         { add_header Cache-Control "no-cache"; }
    location = /manifest.json { add_header Cache-Control "no-cache"; }

    # 带版本的静态资源长缓存
    location ~* \.(css|js|png|svg|ico|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # DeepSeek 代理：前端 X-API-Key → Authorization: Bearer
    location = /api/chat {
        proxy_pass https://api.deepseek.com/chat/completions;
        proxy_set_header Authorization "Bearer $http_x_api_key";
        proxy_set_header Content-Type "application/json";
        proxy_set_header Host api.deepseek.com;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 健康检查
    location = /api/health {
        default_type application/json;
        return 200 '{"ok":true,"app":"Kitty 账本 (kitty-ledger)"}';
    }

    # Kitty API（Node + MySQL，监听 127.0.0.1:8300）：
    # 登录/注册、数据同步 push/pull 等业务接口都走这里。
    # 注意：上方「location = /api/chat」「location = /api/health」是精确匹配，
    # 优先级高于本前缀匹配，DeepSeek 代理与健康检查不受影响。
    location /api/ {
        proxy_pass http://127.0.0.1:8300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
