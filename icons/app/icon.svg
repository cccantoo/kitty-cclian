<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD1DC"/>
      <stop offset="100%" stop-color="#FF8FB5"/>
    </linearGradient>
  </defs>

  <!-- 圆角背景 -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- 耳朵（左） -->
  <polygon points="120,200 100,90 230,170" fill="#FFFFFF" stroke="#5C3D5C" stroke-width="8" stroke-linejoin="round"/>
  <!-- 耳朵（右） -->
  <polygon points="392,200 412,90 282,170" fill="#FFFFFF" stroke="#5C3D5C" stroke-width="8" stroke-linejoin="round"/>

  <!-- 脸部（椭圆） -->
  <ellipse cx="256" cy="290" rx="150" ry="135" fill="#FFFFFF" stroke="#5C3D5C" stroke-width="8"/>

  <!-- 蝴蝶结（左耳外） -->
  <g>
    <ellipse cx="100" cy="115" rx="32" ry="22" fill="#FF4F87" stroke="#5C3D5C" stroke-width="6" transform="rotate(-20 100 115)"/>
    <ellipse cx="155" cy="105" rx="32" ry="22" fill="#FF4F87" stroke="#5C3D5C" stroke-width="6" transform="rotate(-20 155 105)"/>
    <circle cx="128" cy="110" r="14" fill="#FFD700" stroke="#5C3D5C" stroke-width="5"/>
  </g>

  <!-- 眼睛 -->
  <ellipse cx="200" cy="290" rx="10" ry="18" fill="#5C3D5C"/>
  <ellipse cx="312" cy="290" rx="10" ry="18" fill="#5C3D5C"/>

  <!-- 鼻子 -->
  <ellipse cx="256" cy="335" rx="10" ry="7" fill="#FFD700" stroke="#5C3D5C" stroke-width="3"/>

  <!-- 嘴（两条小弧） -->
  <path d="M 240 350 Q 256 366 272 350" fill="none" stroke="#5C3D5C" stroke-width="6" stroke-linecap="round"/>

  <!-- 胡须 -->
  <line x1="175" y1="335" x2="105" y2="320" stroke="#5C3D5C" stroke-width="4" stroke-linecap="round"/>
  <line x1="175" y1="350" x2="105" y2="355" stroke="#5C3D5C" stroke-width="4" stroke-linecap="round"/>
  <line x1="337" y1="335" x2="407" y2="320" stroke="#5C3D5C" stroke-width="4" stroke-linecap="round"/>
  <line x1="337" y1="350" x2="407" y2="355" stroke="#5C3D5C" stroke-width="4" stroke-linecap="round"/>

  <!-- 底部 'K' 装饰 -->
  <text x="256" y="475" font-family="Georgia, serif" font-size="56" font-weight="bold"
        text-anchor="middle" fill="#FFFFFF" opacity="0.85">Kitty</text>
</svg>
